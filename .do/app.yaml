name: fableforge-tg
region: ams
workers:
  - name: tg-bot
    image:
      registry_type: GHCR
      registry: vyorkin
      repository: fableforge-tg
      tag: latest
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: TELOXIDE_TOKEN
        type: SECRET
        value: "${TELOXIDE_TOKEN}"
      - key: OPENROUTER_API_KEY
        type: SECRET
        value: "${OPENROUTER_API_KEY}"
      - key: OPENROUTER_MODEL
        type: GENERAL
        value: "${OPENROUTER_MODEL}"
