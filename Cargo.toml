[workspace]
resolver = "2"
members = ["cli/fableforge", "crates/fableforge-core"]

default-members = ["cli/fableforge"]

[workspace.dependencies]
# fableforge
fableforge-core = { path = "crates/fableforge-core" }

# core
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
] }

# error
thiserror = "2.0"
anyhow = "1.0"

# async
async-trait = "0.1"
tokio = { version = "1.49", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

# parsing
winnow = "0.7"

# cli
clap = { version = "4.5", features = ["derive"] }

# testing
pretty_assertions = "1.4"

[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'
