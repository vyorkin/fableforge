]

[initial_situation]

[initial_situation.times]
items = [
    "давным-давно",
    "в стародавние времена",
    "в некотором царстве",
    "однажды",
    "в прежние времена",
    "в тридесятом царстве",
    "когда ещё звери говорили",
    "в незапамятные времена",
    "во времена стародавние",
    "в ту пору, когда чудеса ещё случались",
]

[initial_situation.family_contexts]
items = [
    "жили-были старик со старухой",
    "жил-был царь с царицей",
    "в одной деревне жила бедная вдова",
    "у одного купца было три сына",
    "жил-был мужик с женой",
    "в тридевятом царстве жил король",
    "у одного старика было три дочери",
    "жил на свете бездетный мельник",
    "в лесной избушке жил старый охотник",
    "у батюшки с матушкой рос единственный сын",
    "жил-был пастух на краю села",
    "в крайней избе жила сирота",
]

[initial_situation.prosperity_states]
items = [
    "и жили они в достатке",
    "но были они бедны",
    "и было у них всего вдоволь",
    "и не знали они горя",
    "но счастья им не хватало",
    "и жили ни богато ни бедно",
    "и был у них чудесный сад",
    "но беда не заставила себя ждать",
    "и жили они тихо да мирно",
    "но тоска-печаль их одолевала",
]
